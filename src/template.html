<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Pulse</h1>
    <h2 class="project-title"> 
        Projects
    </h2>
    <hr>
    <div>
        <form action="">
            <input type="text" name="" id="project-name" placeholder="Project Name">
            <button class="project-submit-btn" type="submit">Create Project</button>
        </form>
    </div>    
    <div>
        <form action="">
            <div>
                <label for="todo-title">Project Title:</label>
                <input type="text" name="project-title" id="todo-title" placeholder="Title"></div>
            <div>
                <label for="todo-notes">Project Notes:</label>
                <input type="text" name="project-notes" id="todo-notes" placeholder="Notes"></div>
            <div>
                <label for="todo-due-date">Project Due Date:</label>
                <input type="text" name="project-due-date" id="todo-due-date" placeholder="Due Date"></div>
            <div>
                <label for="todo-priority">Project Priority:</label>
                <input type="text" name="project-priority" id="todo-priority" placeholder="Priority">
            </div>
            <button class="submit-form-btn" type="submit">Create</button>
        </form>
    </div>    
    <hr>
    <div>
        <div id="my-projects-container"></div>
        <div id="my-todos-container"></div>
    </div>
</body>
</html>
